<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>云与草原</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16222D; --ink-soft:#4C5E6E; --glass:rgba(242,246,249,0.72); --glass-line:rgba(22,40,58,0.10);
  --sun:#B97A12; --track:rgba(22,40,58,0.18); --thumb:#ffffff; --shadow:0 12px 32px rgba(18,32,46,0.20); --sky:#8EA7BF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Barlow","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7EDF2; --ink-soft:#A3B3C1; --glass:rgba(17,27,38,0.58); --glass-line:rgba(255,255,255,0.09);
    --sun:#F2C879; --track:rgba(255,255,255,0.18); --shadow:0 12px 32px rgba(4,10,18,0.35); --sky:#55708D;
  }
}
:root[data-theme="dark"]{
  --ink:#E7EDF2; --ink-soft:#A3B3C1; --glass:rgba(17,27,38,0.58); --glass-line:rgba(255,255,255,0.09);
  --sun:#F2C879; --track:rgba(255,255,255,0.18); --shadow:0 12px 32px rgba(4,10,18,0.35); --sky:#55708D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--ink);-webkit-font-smoothing:antialiased}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#view.dragging{cursor:grabbing}

.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2)}
.stats{border-radius:10px;padding:10px 14px 11px;min-width:176px;line-height:1.35}
.stats .fps{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stats .fps small{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:4px}
.stats p{margin:0;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stats p.gpu{max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.panel{pointer-events:auto;width:276px;border-radius:14px;overflow:hidden}
.panel-toggle{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.panel-toggle:focus-visible{outline:2px solid var(--sun);outline-offset:-2px;border-radius:14px}
.panel-toggle svg{transition:transform .2s ease}
.panel[data-open="false"] .panel-toggle svg{transform:rotate(-90deg)}
.panel[data-open="false"] .panel-body{display:none}
.panel-body{padding:0 16px 14px;max-height:calc(100vh - 120px);overflow:auto}
.panel h2{font-size:12.5px;font-weight:600;margin:14px 0 2px;color:var(--ink-soft)}
.panel h2:first-child{margin-top:2px}
.ctl{display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:2px;margin:8px 0 6px}
.ctl span{font-size:14px}
.ctl output{font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.ctl input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;--fill:50%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(to right,var(--sun) var(--fill),var(--track) var(--fill))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--thumb);margin-top:-6.5px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--sun)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--thumb);box-shadow:0 1px 4px rgba(0,0,0,.35)}
input:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:4px}
.loc-now{margin:4px 0 0;font-size:15px;font-weight:600}
.loc-sub{margin:2px 0 6px;font-size:12.5px;line-height:1.45;color:var(--ink-soft)}
input[type=search]{width:100%;box-sizing:border-box;margin:6px 0 4px;padding:7px 10px;border-radius:9px;border:1px solid var(--glass-line);background:var(--track);color:var(--ink);font:inherit;font-size:14px}
input[type=search]:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.chip{all:unset;box-sizing:border-box;padding:4px 10px;border-radius:999px;background:var(--track);font-size:13px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--sun);font-weight:600}
.chip:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.btn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;margin:8px 0 4px;padding:7px 0;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer;background:var(--track);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.ctl-label{margin:10px 0 0;font-size:14px}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg.seg5{grid-template-columns:repeat(5,1fr)}
.seg.seg-sm span{font-size:12.5px;padding:6px 0}
.stats,.hint,.panel-toggle,.ctl span,.ctl output,.switch,.seg span,.loc-now,.loc-sub,.chip,canvas#view{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 4px;padding:3px;border-radius:9px;background:var(--track)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;font-size:13.5px;padding:5px 0;border-radius:7px;color:var(--ink-soft)}
.seg input:checked + span{background:var(--glass);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg input:focus-visible + span{outline:2px solid var(--sun);outline-offset:1px}
.switch{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;font-size:14px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:34px;height:20px;border-radius:10px;background:var(--track);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--thumb);
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked + i{background:var(--sun)}
.switch input:checked + i::after{transform:translateX(14px)}
.switch input:focus-visible + i{outline:2px solid var(--sun);outline-offset:2px}
.hint{position:fixed;left:14px;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none}
.hint p{margin:0;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--ink-soft)}
.loader{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .6s ease}
.loader.done{opacity:0}
.loader div{width:min(280px,70vw);text-align:center;font-size:15px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.loader b{display:block;height:2px;margin-top:12px;background:rgba(255,255,255,.3);border-radius:1px;overflow:hidden}
.loader b::after{content:"";display:block;height:100%;width:var(--p,0%);background:#fff;transition:width .15s}
.error{position:fixed;inset:0;display:none;place-items:center;padding:24px}
.error.show{display:grid}
.error p{max-width:420px;padding:18px 20px;border-radius:12px;font-size:15px;line-height:1.6}
@media (max-width:640px){
  .hud{padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0}
  .stats{min-width:0;padding:8px 11px}
  .stats .fps{font-size:19px}
  .stats p.gpu{display:none}
  .panel{position:fixed;left:10px;right:10px;bottom:0;width:auto;margin-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  .panel-body{max-height:46vh}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ .loader,.panel-toggle svg,.switch i,.switch i::after{transition:none} }
</style>
</head>
<body>
<canvas id="view" aria-label="实时渲染的草原、花和体积云"></canvas>
<div class="hud">
  <div class="stats glass" aria-live="off">
    <div class="fps"><span id="fps">--</span><small>FPS</small></div>
    <p id="ms">帧时间 -- ms</p>
    <p id="res">云层缓冲 --</p>
    <p id="clock">本地时间 --</p>
    <p id="blades">草叶 --</p>
    <p class="gpu" id="gpu"></p>
  </div>
  <aside class="panel glass" id="panel" data-open="true">
    <button class="panel-toggle" id="panelToggle" aria-expanded="true" aria-controls="panelBody">
      <span>天空与草原</span>
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="panel-body" id="panelBody">
      <h2>地点</h2>
      <p class="loc-now" id="locName">东京</p>
      <p class="loc-sub" id="locSun">日出 --，日落 --</p>
      <input type="search" id="citySearch" placeholder="搜索城市，例如 上海、Paris" autocomplete="off" aria-label="搜索城市">
      <div class="chips" id="cityResults"></div>
      <div class="chips" id="cityCommon"></div>
      <button class="btn" id="geoBtn" type="button">使用我的位置</button>
      <p class="loc-sub" id="geoMsg"></p>
      <h2>时间</h2>
      <label class="ctl"><span>时刻</span><output for="time"></output><input type="range" id="time" min="0" max="23.99" step="0.01"></label>
      <label class="ctl"><span>流速</span><output for="speed"></output><input type="range" id="speed" min="0" max="7" step="1"></label>
      <button class="btn" id="syncNow" type="button">同步到本地时间</button>
      <label class="switch"><span>星座连线</span><input type="checkbox" id="constel"><i></i></label>
      <label class="ctl"><span>朝向</span><output for="sunAz"></output><input type="range" id="sunAz" min="0" max="360" step="1"></label>
      <h2>天气</h2>
      <div class="seg seg-sm" role="radiogroup" aria-label="天气模式">
        <label><input type="radio" name="wxMode" value="follow"><span>跟随天气</span></label>
        <label><input type="radio" name="wxMode" value="dynamic"><span>动态切换</span></label>
        <label><input type="radio" name="wxMode" value="manual"><span>手动切换</span></label>
        <label><input type="radio" name="wxMode" value="off"><span>关闭</span></label>
      </div>
      <p class="loc-now" id="wxNow">多云</p>
      <p class="loc-sub" id="wxInfo"></p>
      <div id="wxManual" hidden>
        <div class="chips" id="wxTypes"></div>
        <label class="ctl"><span>云量</span><output for="coverage"></output><input type="range" id="coverage" min="0.12" max="0.97" step="0.01"></label>
        <label class="ctl"><span>云的密度</span><output for="density"></output><input type="range" id="density" min="0.3" max="2.5" step="0.01"></label>
        <label class="ctl"><span>云速</span><output for="wind"></output><input type="range" id="wind" min="0" max="200" step="1"></label>
        <label class="ctl"><span>地面风力</span><output for="breeze"></output><input type="range" id="breeze" min="0" max="1" step="0.01"></label>
        <label class="ctl"><span>能见度</span><output for="fogVis"></output><input type="range" id="fogVis" min="0" max="1000" step="1"></label>
        <label class="ctl"><span>降雨强度</span><output for="rainAmt"></output><input type="range" id="rainAmt" min="0" max="1" step="0.01"></label>
        <label class="ctl"><span>降雪强度</span><output for="snowAmt"></output><input type="range" id="snowAmt" min="0" max="1" step="0.01"></label>
        <label class="ctl"><span>闪电频率</span><output for="boltFreq"></output><input type="range" id="boltFreq" min="0" max="4" step="0.1"></label>
        <label class="ctl"><span>积水上限</span><output for="puddle"></output><input type="range" id="puddle" min="0" max="1" step="0.01"></label>
        <label class="ctl"><span>积雪上限</span><output for="snowMax"></output><input type="range" id="snowMax" min="0" max="1" step="0.01"></label>
      </div>
      <label class="switch"><span>镜头水滴</span><input type="checkbox" id="lensDrops"><i></i></label>
      <h2>草原</h2>
      <label class="switch"><span>花瓣流</span><input type="checkbox" id="petals"><i></i></label>
      <label class="switch"><span>萤火虫（夜间）</span><input type="checkbox" id="flies"><i></i></label>
      <label class="switch"><span>花苞绽放动画</span><input type="checkbox" id="bloom"><i></i></label>
      <label class="ctl"><span>开花范围</span><output for="bloomR"></output><input type="range" id="bloomR" min="1.5" max="10" step="0.5"></label>
      <label class="switch"><span>花朵常亮（夜间）</span><input type="checkbox" id="flowerGlow"><i></i></label>
      <label class="switch"><span>开花无限距离记忆</span><input type="checkbox" id="infMem"><i></i></label>
      <button class="btn" id="clearMem" type="button">清除开花记录</button>
      <h2>镜头</h2>
      <label class="ctl"><span>离地高度</span><output for="height"></output><input type="range" id="height" min="0" max="1000" step="1"></label>
      <p class="ctl-label" id="sdistLabel">与花瓣流的距离</p>
      <div class="seg seg3" role="radiogroup" aria-labelledby="sdistLabel">
        <label><input type="radio" name="sdist" value="near"><span>近</span></label>
        <label><input type="radio" name="sdist" value="mid"><span>中</span></label>
        <label><input type="radio" name="sdist" value="far"><span>远</span></label>
      </div>
      <label class="switch"><span>花瓣随距离放大</span><input type="checkbox" id="streamScale"><i></i></label>
      <label class="ctl"><span>景深</span><output for="dof"></output><input type="range" id="dof" min="0" max="1" step="0.01"></label>
      <label class="switch"><span>自动飞行</span><input type="checkbox" id="auto"><i></i></label>
      <label class="switch"><span>镜头运动</span><input type="checkbox" id="sway"><i></i></label>
      <h2>画质</h2>
      <div class="seg" role="radiogroup" aria-label="画质">
        <label><input type="radio" name="q" value="low"><span>低</span></label>
        <label><input type="radio" name="q" value="med"><span>中</span></label>
        <label><input type="radio" name="q" value="high"><span>高</span></label>
        <label><input type="radio" name="q" value="ultra"><span>极高</span></label>
      </div>
      <label class="switch"><span>体积光</span><input type="checkbox" id="god"><i></i></label>
    </div>
  </aside>
</div>
<div class="hint"><p class="glass" id="hintText">拖动画面转向，WASD 移动，Q 和 E 升降，按住 Shift 加速，滚轮调视野</p></div>
<div class="loader" id="loader"><div><span id="loadText">正在生成云噪声</span><b id="loadBar"></b></div></div>
<div class="error" id="error"><p class="glass" id="errorText"></p></div>

<script>
(() => {
'use strict';
const canvas = document.getElementById('view');
const $ = (id) => document.getElementById(id);
function fail(msg){ $('errorText').textContent = msg; $('error').classList.add('show'); $('loader').classList.add('done'); }

const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, depth:false, stencil:false,
  powerPreference:'high-performance', preserveDrawingBuffer:false});
if (!gl){ fail('这个浏览器没有开启 WebGL2。请用最新版的 Chrome、Edge、Safari 或 Firefox 打开。'); return; }
if (!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'))){
  fail('这块显卡不支持浮点渲染目标（EXT_color_buffer_float），体积云无法运行。'); return;
}
(() => {
  let name = '';
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  try { name = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch(e) {}
  name = String(name || '').replace(/^ANGLE \((.*)\)$/, '$1').replace(/\s*Direct3D.*$/,'').replace(/,\s*$/,'');
  $('gpu').textContent = name ? 'GPU ' + name : '';
})();
const coarse = matchMedia('(pointer: coarse)').matches;
if (coarse) $('hintText').textContent = '单指滑动操控，双击冲刺，两指双击掉头，三指双击停下或继续';

/* ================================================================== */
/*  Terrain noise (CPU copy shared with the GPU so the camera can      */
/*  follow the ground exactly)                                         */
/* ================================================================== */
const TN = 256, TCELLS = 8;
const tnData = (() => {
  const hash = (i, j) => {
    let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
  const gx = new Float32Array(TCELLS * TCELLS), gy = new Float32Array(TCELLS * TCELLS);
  for (let j = 0; j < TCELLS; j++) for (let i = 0; i < TCELLS; i++){
    const a = hash(i + 17, j + 31) * Math.PI * 2;
    gx[j * TCELLS + i] = Math.cos(a); gy[j * TCELLS + i] = Math.sin(a);
  }
  const q = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const out = new Float32Array(TN * TN);
  for (let y = 0; y < TN; y++) for (let x = 0; x < TN; x++){
    const px = (x + 0.5) / TN * TCELLS, py = (y + 0.5) / TN * TCELLS;
    const i0 = Math.floor(px), j0 = Math.floor(py), fx = px - i0, fy = py - j0;
    const g = (i, j, dx, dy) => { const k = (j % TCELLS) * TCELLS + (i % TCELLS); return gx[k] * dx + gy[k] * dy; };
    const a = g(i0, j0, fx, fy), b = g(i0 + 1, j0, fx - 1, fy), c = g(i0, j0 + 1, fx, fy - 1), d = g(i0 + 1, j0 + 1, fx - 1, fy - 1);
    const u = q(fx), v = q(fy);
    out[y * TN + x] = 1.45 * ((a + (b - a) * u) + ((c + (d - c) * u) - (a + (b - a) * u)) * v);
  }
  return out;
})();
function tnSample(u, v){
  const x = u * TN - 0.5, y = v * TN - 0.5;
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const xa = ((x0 % TN) + TN) % TN, xb = (xa + 1) % TN, ya = ((y0 % TN) + TN) % TN, yb = (ya + 1) % TN;
  const a = tnData[ya * TN + xa], b = tnData[ya * TN + xb], c = tnData[yb * TN + xa], d = tnData[yb * TN + xb];
  return (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
}
// amplitude (m), period (m), rotation cos, sin, offset u, v, feature size (m)
const OCT = [
  [70.0, 12000, 1.0, 0.0, 0.13, 0.71, 1500],
  [58.0, 2800, 0.8, 0.6, 0.41, 0.07, 350],
  [19.0, 1100, 0.28, 0.96, 0.77, 0.29, 137],
  [4.5, 420, -0.6, 0.8, 0.19, 0.53, 52],
  [0.8, 150, 0.96, -0.28, 0.61, 0.83, 19],
];
function groundH(x, z){
  let h = 0;
  for (const [amp, per, c, s, ou, ov] of OCT){
    const rx = c * x - s * z, rz = s * x + c * z;
    h += amp * tnSample(rx / per + ou, rz / per + ov);
  }
  return h;
}
const f = (v) => { const s = Number(v).toPrecision(8); return /[.e]/.test(s) ? s : s + '.0'; };
const TERRAIN_GLSL = `
uniform sampler2D uTerr;
float tn(vec2 p){ return textureLod(uTerr, p, 0.0).r; }
float octFade(float feat, float sp){ return 1.0 - smoothstep(feat * 0.2, feat * 0.5, sp); }
vec2 rot2(vec2 w, float c, float s){ return vec2(c * w.x - s * w.y, s * w.x + c * w.y); }
float terrainH(vec2 w, float sp){
  float h = 0.0;
${OCT.map(o => `  h += ${f(o[0])} * tn(rot2(w, ${f(o[2])}, ${f(o[3])}) * ${f(1 / o[1])} + vec2(${f(o[4])}, ${f(o[5])})) * octFade(${f(o[6])}, sp);`).join('\n')}
  return h;
}`;

/* ================================================================== */
/*  Shaders                                                            */
/* ================================================================== */

const PRE = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
precision highp sampler3D;
#define PI 3.14159265359
float saturate(float x){ return clamp(x, 0.0, 1.0); }
float remap(float v, float a, float b, float c, float d){ return c + (v - a) * (d - c) / (b - a); }
`;
const HEAD = PRE + `in vec2 vUv;\n`;

const NOISE_FS = HEAD + `
uniform float uSlice; uniform float uSize; uniform int uMode;
out vec4 o;
vec3 hash33(vec3 p3){ p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
float gradNoise(vec3 x, float freq){
  vec3 p = floor(x); vec3 w = fract(x);
  vec3 u = w * w * w * (w * (w * 6.0 - 15.0) + 10.0);
  vec3 ga = hash33(mod(p + vec3(0,0,0), freq)) * 2.0 - 1.0; vec3 gb = hash33(mod(p + vec3(1,0,0), freq)) * 2.0 - 1.0;
  vec3 gc = hash33(mod(p + vec3(0,1,0), freq)) * 2.0 - 1.0; vec3 gd = hash33(mod(p + vec3(1,1,0), freq)) * 2.0 - 1.0;
  vec3 ge = hash33(mod(p + vec3(0,0,1), freq)) * 2.0 - 1.0; vec3 gf = hash33(mod(p + vec3(1,0,1), freq)) * 2.0 - 1.0;
  vec3 gg = hash33(mod(p + vec3(0,1,1), freq)) * 2.0 - 1.0; vec3 gh = hash33(mod(p + vec3(1,1,1), freq)) * 2.0 - 1.0;
  float va = dot(ga, w - vec3(0,0,0)), vb = dot(gb, w - vec3(1,0,0)), vc = dot(gc, w - vec3(0,1,0)), vd = dot(gd, w - vec3(1,1,0));
  float ve = dot(ge, w - vec3(0,0,1)), vf = dot(gf, w - vec3(1,0,1)), vg = dot(gg, w - vec3(0,1,1)), vh = dot(gh, w - vec3(1,1,1));
  return va + u.x*(vb-va) + u.y*(vc-va) + u.z*(ve-va) + u.x*u.y*(va-vb-vc+vd) + u.y*u.z*(va-vc-ve+vg) + u.z*u.x*(va-vb-ve+vf) + u.x*u.y*u.z*(-va+vb+vc-vd+ve-vf-vg+vh);
}
float perlinFbm(vec3 p, float freq, int oct){
  float G = exp2(-0.85), amp = 1.0, n = 0.0;
  for (int i = 0; i < 8; i++){ if (i >= oct) break; n += amp * gradNoise(p * freq, freq); freq *= 2.0; amp *= G; }
  return n;
}
float worley(vec3 uv, float freq){
  vec3 id = floor(uv * freq); vec3 p = fract(uv * freq); float md = 1e4;
  for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++){
    vec3 off = vec3(float(x), float(y), float(z));
    vec3 h = hash33(mod(id + off, vec3(freq))) + off; vec3 d = p - h; md = min(md, dot(d, d));
  }
  return 1.0 - md;
}
float worleyFbm(vec3 uv, float freq){ return worley(uv, freq) * 0.625 + worley(uv, freq * 2.0) * 0.25 + worley(uv, freq * 4.0) * 0.125; }
void main(){
  if (uMode == 2){
    vec3 uv = vec3(gl_FragCoord.xy / uSize, 0.37);
    float p = perlinFbm(uv, 4.0, 6) * 0.5 + 0.5;
    float w = worleyFbm(uv, 3.0);
    float cov = saturate(remap(p, 0.2, 0.8, 0.0, 1.0) * 0.65 + w * 0.5 - 0.12);
    float type = saturate(perlinFbm(uv + vec3(0.31, 0.17, 0.5), 2.0, 4) * 0.8 + 0.5);
    o = vec4(cov, type, 0.0, 1.0); return;
  }
  vec3 uv = vec3(gl_FragCoord.xy / uSize, (uSlice + 0.5) / uSize);
  if (uMode == 0){
    float pf = mix(1.0, perlinFbm(uv, 4.0, 6), 0.5); pf = abs(pf * 2.0 - 1.0);
    float g = worleyFbm(uv, 4.0), b = worleyFbm(uv, 8.0), a = worleyFbm(uv, 16.0);
    o = vec4(remap(pf, 0.0, 1.0, g, 1.0), g, b, a);
  } else {
    o = vec4(worleyFbm(uv, 4.0), worleyFbm(uv, 8.0), worleyFbm(uv, 16.0), 1.0);
  }
}`;

/* ---------- clouds / atmosphere (shared) ---------- */
const COMMON = `
const float R_EARTH = 6371.0;
const vec3 PC = vec3(0.0, -6371.0, 0.0);
const float SHAPE_FREQ = 1.0 / 7.5;
const float DETAIL_FREQ = 1.0 / 0.7;
const float WEATHER_FREQ = 1.0 / 64.0;
const float SIGMA = 60.0;
const float SHAPE_TEXEL = 7.5 / 128.0;
const float DETAIL_TEXEL = 0.7 / 64.0;
uniform sampler3D uShape; uniform sampler3D uDetail; uniform sampler2D uWeather; uniform sampler2D uSkyLut;
uniform vec3 uCamPos; uniform vec3 uSunDir; uniform vec2 uLayer;
uniform float uCoverage; uniform float uDensity;
uniform vec3 uWind; uniform vec3 uWindDetail; uniform vec2 uWindDir;
vec2 raySphere(vec3 ro, vec3 rd, float r){
  vec3 oc = ro - PC; float b = dot(oc, rd); float c = dot(oc, oc) - r * r; float d = b * b - c;
  if (d < 0.0) return vec2(-1.0); float s = sqrt(d); return vec2(-b - s, -b + s);
}
vec2 skyUV(vec3 d){
  float el = asin(clamp(d.y, -1.0, 1.0)); float az = atan(d.x, d.z);
  return vec2(az / (2.0 * PI) + 0.5, 0.5 + 0.5 * sign(el) * sqrt(abs(el) / (PI * 0.5)));
}
vec3 skyLookup(vec3 d){ return textureLod(uSkyLut, skyUV(d), 0.0).rgb; }
float heightGradient(float h, float type){ float top = mix(0.5, 1.0, type); return smoothstep(0.0, 0.07, h) * (1.0 - smoothstep(top * 0.4, top, h)); }
float lodOf(float fp, float texel){ return max(0.0, log2(max(fp, 1e-6) / texel)); }
float cloudBase(vec3 pw, float h01, float fp){
  if (h01 <= 0.0 || h01 >= 1.0) return 0.0;
  vec3 ps = pw + uWind; ps.xz += uWindDir * (h01 * 0.6);
  vec2 wt = textureLod(uWeather, ps.xz * WEATHER_FREQ, 0.0).rg;
  float cov = saturate(uCoverage + (wt.r - 0.6) * 1.2);
  if (cov <= 0.002) return 0.0;
  vec4 n = textureLod(uShape, ps * SHAPE_FREQ, lodOf(fp, SHAPE_TEXEL));
  float wf = n.g * 0.625 + n.b * 0.25 + n.a * 0.125;
  float shape = saturate(remap(remap(n.r, wf - 1.0, 1.0, 0.0, 1.0), 0.62, 0.95, 0.0, 1.0));
  shape *= heightGradient(h01, wt.g);
  return saturate(remap(shape, 1.0 - cov, 1.0, 0.0, 1.0)) * cov;
}
float erode(float c, vec3 pw, float h01, float fp){
  vec3 dn = textureLod(uDetail, (pw + uWindDetail) * DETAIL_FREQ, lodOf(fp, DETAIL_TEXEL)).rgb;
  float df = dn.r * 0.625 + dn.g * 0.25 + dn.b * 0.125;
  float dm = mix(df, 1.0 - df, saturate(h01 * 4.0));
  return saturate(remap(c, dm * 0.45, 1.0, 0.0, 1.0));
}
float hg(float g, float c){ float g2 = g * g; return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5)); }
float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
`;

const SKYLUT_FS = HEAD + COMMON + `
uniform float uSunI, uMoonI; uniform vec3 uMoonDir, uGlow, uMS;
out vec4 o;
const vec3 BR = vec3(5.802e-3, 13.558e-3, 33.1e-3); const float BM = 3.996e-3, BME = 4.40e-3;
const vec3 BO = vec3(0.650e-3, 1.881e-3, 0.085e-3); const float RA = 6471.0;
vec3 dens(float h){ return vec3(exp(-h / 8.0), exp(-h / 1.2), max(0.0, 1.0 - abs(h - 25.0) / 15.0)); }
vec3 scatterFrom(vec3 ro, vec3 rd, float tmax, vec3 L, float I){
  const int N = 20; float dt = tmax / float(N);
  vec3 sumR = vec3(0.0), sumM = vec3(0.0), odv = vec3(0.0);
  for (int i = 0; i < N; i++){
    vec3 p = ro + rd * ((float(i) + 0.5) * dt);
    vec3 dd = dens(max(length(p - PC) - R_EARTH, 0.0)) * dt;
    vec3 odm = odv + dd * 0.5; odv += dd;
    vec2 gl = raySphere(p, L, R_EARTH);
    if (gl.x > 0.0 && dot(p - PC, L) < 0.0) continue;
    float dl = raySphere(p, L, RA).y / 8.0; vec3 odl = vec3(0.0);
    for (int j = 0; j < 8; j++){ vec3 q = p + L * ((float(j) + 0.5) * dl); odl += dens(max(length(q - PC) - R_EARTH, 0.0)) * dl; }
    vec3 att = exp(-(BR * (odm.x + odl.x) + BME * (odm.y + odl.y) + BO * (odm.z + odl.z)));
    sumR += dd.x * att; sumM += dd.y * att;
  }
  float mu = dot(rd, L); float pr = 3.0 / (16.0 * PI) * (1.0 + mu * mu);
  float gg = 0.8, g2 = gg * gg; float pm = 3.0 / (8.0 * PI) * ((1.0 - g2) * (1.0 + mu * mu)) / ((2.0 + g2) * pow(1.0 + g2 - 2.0 * gg * mu, 1.5));
  return I * (sumR * BR * pr + sumM * BM * pm);
}
void main(){
  float x = vUv.y * 2.0 - 1.0; float el = sign(x) * x * x * PI * 0.5; float az = (vUv.x - 0.5) * 2.0 * PI;
  vec3 rd = vec3(cos(el) * sin(az), sin(el), cos(el) * cos(az));
  vec3 ro = vec3(0.0, max(uCamPos.y, 0.001), 0.0);
  float tmax = raySphere(ro, rd, RA).y; vec2 g = raySphere(ro, rd, R_EARTH); if (g.x > 0.0) tmax = g.x;
  vec3 col = scatterFrom(ro, rd, tmax, uSunDir, uSunI);
  if (uMoonI > 0.0) col += scatterFrom(ro, rd, tmax, uMoonDir, uMoonI);
  float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
  float hw = pow(1.0 - abs(rd.y), 5.0) * mix(0.15, 0.75, smoothstep(0.03, 0.35, uSunDir.y));
  col = mix(col, l * vec3(0.90, 0.99, 1.13), hw);
  /* airglow + unresolved starlight, brighter toward the horizon (van Rhijn) */
  col += uGlow * (1.0 + 0.6 * pow(1.0 - abs(rd.y), 4.0));
  /* light scattered more than once: keeps the sky blue after sunset while the upper air is still sunlit */
  col += uMS * (0.6 + 0.4 * (1.0 - abs(rd.y)));
  o = vec4(col, 1.0);
}`;

const CSHADOW_FS = HEAD + COMMON + `
uniform vec3 uShadowP;
out vec4 o;
void main(){
  vec2 xz = uShadowP.xy + (vUv - 0.5) * uShadowP.z;
  float sy = max(uSunDir.y, 0.04); float od = 0.0;
  for (int i = 0; i < 6; i++){
    float hf = (float(i) + 0.5) / 6.0; float hh = mix(uLayer.x, uLayer.y, hf);
    vec2 q = xz + uSunDir.xz * ((hh - 0.05) / sy);
    od += cloudBase(vec3(q.x, hh, q.y), hf, 0.1);
  }
  od *= (uLayer.y - uLayer.x) / 6.0 / sy * uDensity * SIGMA * 0.07;
  o = vec4(mix(0.16, 1.0, exp(-od)), 0.0, 0.0, 1.0);
}`;

const CLOUD_FS = HEAD + COMMON + `
uniform vec3 uRight, uUp, uFwd; uniform vec2 uTan;
uniform vec3 uSunColor; uniform vec3 uAmbTop, uAmbBottom;
uniform int uSteps, uLightSteps; uniform float uFrame, uPixAngle, uFogK, uFwdScat, uAmbOcc;
uniform vec4 uFlashP; uniform vec3 uFlashC;
layout(location = 0) out vec4 oColor;
layout(location = 1) out vec4 oDepth;
float lightOD(vec3 pr, float fp){
  float od = 0.0, prev = 0.0, n = float(uLightSteps);
  for (int i = 0; i < 8; i++){
    if (i >= uLightSteps) break;
    float fr = (float(i) + 1.0) / n; float tt = 1.3 * fr * fr;
    vec3 sp = pr + uSunDir * (0.5 * (prev + tt));
    float h = length(sp - PC) - R_EARTH; float h01 = (h - uLayer.x) / (uLayer.y - uLayer.x);
    if (h01 >= 1.0) break;
    vec3 pw = vec3(sp.x + uCamPos.x, h, sp.z + uCamPos.z);
    float fpi = max(fp, (tt - prev) * 0.5);
    float c = cloudBase(pw, h01, fpi);
    if (c > 0.0 && i < 3) c = erode(c, pw, h01, fpi);
    od += c * (tt - prev); prev = tt;
  }
  return od;
}
void main(){
  vec3 rd = normalize(uFwd + (vUv.x * 2.0 - 1.0) * uTan.x * uRight + (vUv.y * 2.0 - 1.0) * uTan.y * uUp);
  vec3 ro = vec3(0.0, uCamPos.y, 0.0); float hc = uCamPos.y;
  vec2 iB = raySphere(ro, rd, R_EARTH + uLayer.x), iT = raySphere(ro, rd, R_EARTH + uLayer.y), iG = raySphere(ro, rd, R_EARTH);
  float t0 = -1.0, t1 = -1.0; bool inside = false;
  if (hc < uLayer.x){ if (!(iG.x > 0.0)){ t0 = iB.y; t1 = iT.y; } }
  else if (hc < uLayer.y){ inside = true; t0 = 0.0; t1 = iB.x > 0.0 ? iB.x : iT.y; }
  else if (iT.x > 0.0){ t0 = iT.x; t1 = iB.x > 0.0 ? iB.x : iT.y; }
  const float FAR = 95.0;
  if (t0 < 0.0 || t0 > FAR){ oColor = vec4(0.0, 0.0, 0.0, 1.0); oDepth = vec4(FAR); return; }
  t1 = min(t1, t0 + 60.0); float seg = t1 - t0;
  float jit = fract(ign(gl_FragCoord.xy) + uFrame * 0.61803398875);
  float cosT = dot(rd, uSunDir);
  float ph0 = mix(hg(0.80 * uFwdScat, cosT), hg(-0.25, cosT), 0.30), ph1 = mix(hg(0.40 * uFwdScat, cosT), hg(-0.125, cosT), 0.30);
  float ph2 = mix(hg(0.20, cosT), hg(-0.06, cosT), 0.30), ph3 = 1.0 / (4.0 * PI);
  float baseDt = max(seg / float(uSteps), 0.022);
  float t = t0 + (inside ? 0.02 : baseDt) * jit;
  vec3 L = vec3(0.0); float T = 1.0, wsum = 0.0, dsum = 0.0;
  for (int i = 0; i < 160; i++){
    if (i >= uSteps || t > t1) break;
    float dt = inside ? clamp(t * 0.04, 0.02, max(baseDt, 0.02)) : baseDt;
    vec3 p = ro + rd * t;
    float h = length(p - PC) - R_EARTH; float h01 = (h - uLayer.x) / (uLayer.y - uLayer.x);
    float fp = t * uPixAngle;
    vec3 pw = vec3(p.x + uCamPos.x, h, p.z + uCamPos.z);
    float c = cloudBase(pw, h01, fp);
    if (c > 0.0){
      float d = erode(c, pw, h01, fp);
      if (d > 0.002){
        float sigE = d * uDensity * SIGMA;
        float od = lightOD(p, fp) * uDensity * SIGMA;
        float sun = 1.5 * (ph0 * exp(-od) + 0.65 * ph1 * exp(-od * 0.3) + 0.42 * ph2 * exp(-od * 0.09) + 0.27 * ph3 * exp(-od * 0.027));
        sun *= mix(1.0, 1.0 - exp(-sigE * 0.35), 0.45 * (1.0 - saturate(cosT)));
        vec3 amb = mix(uAmbBottom, uAmbTop, saturate(h01 * 1.25)) * mix(0.55, 1.0, saturate(h01 * 1.6));
        /* skylight reaching deep inside a cloud is occluded, so thin eroded edges stay brighter than the core */
        amb *= mix(1.0, exp(-od * 0.18), uAmbOcc);
        float Ts = exp(-sigE * dt);
        L += T * (uSunColor * sun + amb) * (1.0 - Ts) * 0.985;
        vec3 fd = pw - uFlashP.xyz; L += T * (1.0 - Ts) * uFlashC * exp(-dot(fd, fd) / (uFlashP.w * uFlashP.w));
        float Tn = T * Ts; dsum += (T - Tn) * t; wsum += T - Tn; T = Tn;
        if (T < 0.008) break;
      }
    }
    t += dt;
  }
  T = saturate((T - 0.008) / 0.992);
  float depth = wsum > 1e-4 ? dsum / wsum : t0 + min(seg, 6.0) * 0.5;
  float e = exp(-depth * uFogK);
  L = L * e + skyLookup(rd) * (1.0 - T) * (1.0 - e);
  oColor = vec4(L, T); oDepth = vec4(depth, 0.0, 0.0, 1.0);
}`;

const TAA_FS = HEAD + `
uniform sampler2D uCur, uCurDepth, uHist;
uniform vec3 uRight, uUp, uFwd; uniform vec2 uTan; uniform vec3 uPRight, uPUp, uPFwd; uniform vec2 uPTan;
uniform vec3 uCamDelta; uniform float uBlend; uniform int uReset; uniform vec2 uTexel;
out vec4 o;
void main(){
  vec4 cur = textureLod(uCur, vUv, 0.0);
  if (uReset == 1){ o = cur; return; }
  float dep = textureLod(uCurDepth, vUv, 0.0).r;
  vec3 rd = normalize(uFwd + (vUv.x * 2.0 - 1.0) * uTan.x * uRight + (vUv.y * 2.0 - 1.0) * uTan.y * uUp);
  vec3 p = rd * dep + uCamDelta; float w = dot(p, uPFwd);
  vec2 puv = vec2(dot(p, uPRight) / (w * uPTan.x), dot(p, uPUp) / (w * uPTan.y)) * 0.5 + 0.5;
  if (w <= 0.0 || any(lessThan(puv, vec2(0.0))) || any(greaterThan(puv, vec2(1.0)))){ o = cur; return; }
  vec4 hist = textureLod(uHist, puv, 0.0);
  vec4 mn = cur, mx = cur, m1 = vec4(0.0), m2 = vec4(0.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
    vec4 s = textureLod(uCur, vUv + vec2(float(x), float(y)) * uTexel, 0.0);
    mn = min(mn, s); mx = max(mx, s); m1 += s; m2 += s * s;
  }
  m1 /= 9.0; m2 /= 9.0; vec4 sd = sqrt(max(m2 - m1 * m1, 0.0));
  vec4 lo = max(mn, m1 - sd * 1.6), hi = min(mx, m1 + sd * 1.6);
  hist = clamp(hist, lo - (hi - lo) * 0.15, hi + (hi - lo) * 0.15);
  o = mix(hist, cur, uBlend);
}`;

/* ---------- display transform used by every scene shader (grading + vignette happen in post) ---------- */
const DISPLAY = `
uniform float uExposure; uniform vec2 uRes;
vec3 aces(vec3 x){
  const mat3 I = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
  const mat3 O = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
  x = I * x; vec3 a = x * (x + 0.0245786) - 0.000090537; vec3 b = x * (0.983729 * x + 0.4329510) + 0.238081;
  return clamp(O * (a / b), 0.0, 1.0);
}
vec3 srgbOut(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
vec3 toDisplay(vec3 c){
  c *= uExposure;
  c *= vec3(0.96, 1.0, 1.05);
  return srgbOut(aces(c)) + (fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))) - 0.5) / 255.0;
}`;

/* ---------- scene helpers (vertex + fragment) ---------- */
const SCENE = TERRAIN_GLSL + `
uniform vec3 uCamM;
uniform vec3 uR, uU, uF; uniform vec2 uTanS; uniform vec2 uDepthAB;
uniform float uTime; uniform vec2 uWindDirG; uniform float uWindStr;
uniform sampler2D uCShadow; uniform vec3 uShadowP;
vec4 project(vec3 p){ vec3 v = vec3(dot(p, uR), dot(p, uU), dot(p, uF)); return vec4(v.x / uTanS.x, v.y / uTanS.y, v.z * uDepthAB.x + uDepthAB.y, v.z); }
/* travelling gust bands across the field: 0 calm .. 1 crest of a wave */
float windWave(vec2 w){
  vec2 d = uWindDirG, dp = vec2(-d.y, d.x);
  float along = dot(w, d), across = dot(w, dp);
  float warp = tn(vec2(along * (1.0 / 75.0), across * (1.0 / 170.0)) + vec2(0.2, 0.9));
  float mask = smoothstep(-0.45, 0.3, tn(w * (1.0 / 230.0) + vec2(0.5, 0.5)));
  float band = 0.5 + 0.5 * sin((along - uTime * 9.0) * (6.2831853 / 32.0) + warp * 3.2);
  band *= band * band;
  float rip = 0.5 + 0.5 * sin((along * 0.7 + across * 0.3 - uTime * 6.5) * (6.2831853 / 11.0) + warp * 2.0);
  return saturate(band * mask * 1.15 + rip * rip * 0.22 * mask);
}
uniform float uCShadowAmt;
float cshadow(vec2 wKm){ return mix(1.0, textureLod(uCShadow, (wKm - uShadowP.xy) / uShadowP.z + 0.5, 0.0).r, uCShadowAmt); }
/* top-down glow map: light from flowers, petals and fireflies splatted around the camera */
uniform sampler2D uGlowMap; uniform vec4 uGlowP4;
vec3 glowAt(vec2 w){
  if (uGlowP4.w <= 0.0) return vec3(0.0);
  vec2 uv = (w - uGlowP4.xy) / uGlowP4.z + 0.5;
  if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return vec3(0.0);
  return textureLod(uGlowMap, uv, 0.0).rgb * uGlowP4.w;

  /* lens water map from the drop simulation: rg = surface slope (blended, so un-premultiply), b = thickness, a = coverage */
  vec2 uv = vUv; float dropShade = 0.0, glint = 0.0, wet = 0.0;
  if (uDrops > 0.5){
    vec4 lw = texture(uLens, vUv);
    wet = lw.a;
    if (wet > 0.004){
      vec2 n = clamp((lw.rg * 2.0 - 1.0) / max(wet, 0.05), -1.0, 1.0);
      uv = clamp(vUv - n * vec2(uRes.y / uRes.x, 1.0) * 0.05, 0.0, 1.0);   /* a drop is a tiny lens: it flips what lies behind */
      dropShade = wet * smoothstep(0.6, 1.0, length(n));
      glint = wet * pow(max(dot(normalize(vec3(n, 0.55)), normalize(vec3(-0.45, 0.6, 1.0))), 0.0), 40.0);
    }
  }
  vec3 col = texture(uScene, uv).rgb;
  if (wet > 0.004){   /* the water sits on the lens, so what it shows is out of focus */
    vec2 bo = vec2(0.003 * uRes.y / uRes.x, 0.003);
    vec3 blur = (col + texture(uScene, uv + bo).rgb + texture(uScene, uv - bo).rgb + texture(uScene, uv + vec2(bo.x, -bo.y)).rgb + texture(uScene, uv + vec2(-bo.x, bo.y)).rgb) * 0.2;
    col = mix(texture(uScene, vUv).rgb, blur, wet);
  }
  if (uDofOn > 0.5){
    float dS = texture(uDepth, uv).r;
    float cf = abs(cocOf(linZ(dS))) * (dS > 0.9999999 ? uSkyCoc : 1.0);
    vec4 dof = texture(uDof, uv);
    col = mix(col, dof.rgb, smoothstep(0.35, 1.3, max(cf, dof.a)));
  }
  col += texture(uBloom, uv).rgb * uBloomI;
  col = col * (1.0 - 0.32 * dropShade) + glint * 0.5;
  /* grading: lush saturation, cool shade, warm light, lifted blacks */
  float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(l), col, uSat + (1.3 - uSat) * smoothstep(0.5, 0.85, l) * uNight);
  col *= mix(uShTint, uHiTint, smoothstep(0.15, 0.85, l));
  col = col * 0.955 + uLift;
  /* night vision: rods take over, so colour drains toward a cool blue and the image gets grainier
     (Jensen et al. 2001 night sky model; Thompson, Shirley & Ferwerda 2002) */
  float ln = dot(col, vec3(0.2126, 0.7152, 0.0722));
  /* mesopic vision: rods drain colour from the dark, cones still see the lights in colour */
  col = mix(col, ln * vec3(0.62, 0.78, 1.15), uNight * 0.55 * (1.0 - smoothstep(0.45, 0.8, ln)));
  col += (ign(gl_FragCoord.xy + vec2(uFrameN * 5.588, uFrameN * 3.271)) - 0.5) * 0.03 * uNight;
  vec2 q = vUv - 0.5;
  col *= 1.0 - 0.32 * dot(q * vec2(uRes.x / uRes.y, 1.0), q * vec2(uRes.x / uRes.y, 1.0)) * 0.9;
  col += (ign(gl_FragCoord.xy + 17.0) - 0.5) / 255.0;
  o = vec4(col, 1.0);
}`;

/* mid-range grass as stacked translucent slices over the terrain (geometry near, volume slices mid, texture far:
   the hybrid LOD of Boulanger, Pattanaik & Bouatouch 2009; shell/volumetric grass as surveyed by Habel 2009) */
const SHELL_VS = VPRE + SCENE + `
uniform float uNA, uNR; uniform vec2 uRadAB;
uniform float uShellS; uniform vec2 uShellR;
uniform vec3 uSunDir, uSunGround, uSkyIrr; uniform float uFogKG;
uniform sampler2D uSkyLut;
out vec3 vRel; out vec2 vW; out vec3 vTipLit; out vec3 vBaseLit; out vec4 vFog; out vec2 vOff; out float vFade;
vec2 skyUVv(vec3 d){ float el = asin(clamp(d.y, -1.0, 1.0)); float az = atan(d.x, d.z); return vec2(az / (2.0 * PI) + 0.5, 0.5 + 0.5 * sign(el) * sqrt(abs(el) / (PI * 0.5))); }
vec3 litV(vec3 alb, vec3 n, vec3 V, float t, float sh, float ao){
  alb *= 1.0 - 0.3 * uWet;
  float ndl = dot(n, uSunDir); vec3 sun = uSunGround * sh;
  vec3 c = alb / PI * (sun * saturate(ndl * 0.6 + 0.4) * mix(0.45, 1.0, ao) + uSkyIrr * ao);
  float back = pow(saturate(dot(-V, uSunDir)), 3.0);
  c += alb * vec3(1.2, 1.25, 0.45) * sun * (back * 1.5 + saturate(-ndl) * 0.25) * (0.25 + 0.75 * t) / PI;

void main(){
  int na = int(uNA + 0.5) + 1;
  int ring = gl_VertexID / na; int seg = gl_VertexID - ring * na;
  float t = float(ring) / uNR; float ex = exp(uRadAB.y * t);
  float r = uRadAB.x * (ex - 1.0);
  float ang = float(seg) / uNA * 6.28318530718;
  vec2 rel = vec2(cos(ang), sin(ang)) * r;
  float sp = max(uRadAB.x * uRadAB.y * ex / uNR, r * 6.2832 / uNA);
  vec2 w = uCamM.xz + rel;
  float h = terrainH(w, sp);
  float e = max(sp * 0.5, 0.25);
  vec3 n = normalize(vec3(h - terrainH(w + vec2(e, 0.0), sp), e, h - terrainH(w + vec2(0.0, e), sp)));
  float Hc = 0.68 * (0.86 + 0.3 * tn(w * (1.0 / 120.0) + vec2(0.23, 0.61)));
  vec3 p = vec3(rel.x, h - uCamM.y + Hc * uShellS, rel.y);
  float d = length(rel);
  vFade = smoothstep(uShellR.x * 0.5, uShellR.x, d) * (1.0 - smoothstep(uShellR.y * 0.65, uShellR.y, d)) * (1.0 - smoothstep(0.15, 0.9, puddleMask(w)));
  float p1 = tn(w * (1.0 / 310.0) + vec2(0.37, 0.11)), p2 = tn(w * (1.0 / 85.0) + vec2(0.71, 0.43));
  float wave = windWave(w);
  vec3 V = -normalize(p); vec3 N = normalize(mix(n, vec3(0.0, 1.0, 0.0), 0.5));
  float sh = cshadow(w * 0.001);
  vTipLit = litV(mix(waveSheen(grassTip(p1, p2), wave), SNOW_ALB, uSnowCov * 0.75), N, V, 1.0, sh, 1.0);
  vBaseLit = litV(mix(mix(G_BASE, grassTip(p1, p2), 0.6), SNOW_ALB, uSnowCov * 0.9), N, V, 0.3, sh, mix(0.6, 0.9, uShellS));
  vec3 gw = glowAt(w);
  vTipLit += waveSheen(grassTip(p1, p2), wave) * gw * 0.7; vBaseLit += mix(G_BASE, grassTip(p1, p2), 0.35) * gw * 0.42;
  float dist = length(p); vec3 rd = p / dist;
  vec3 hzF = textureLod(uSkyLut, skyUVv(normalize(vec3(rd.x, max(rd.y, 0.0) + 0.012, rd.z))), 0.0).rgb;
  float eF = exp(-dist * 0.001 * uFogKG), fw = wxFogF(p), aN = eF * (1.0 - fw);
  vFog = vec4((hzF * (1.0 - eF) * (1.0 - fw) + uFogCol * fw) / max(1.0 - aN, 1e-4), aN);
  vOff = uWindDirG * uWindStr * (0.1 + 1.25 * wave) * 0.45 * uShellS * uShellS;

const SHELL_FS = PRE + DISPLAY + `
in vec3 vRel; in vec2 vW; in vec3 vTipLit; in vec3 vBaseLit; in vec4 vFog; in vec2 vOff; in float vFade;
uniform float uShellS, uShellCell, uPixAng;
out vec4 o;
vec4 hash42(vec2 p){ vec4 p4 = fract(vec4(p.xyxy) * vec4(0.1031, 0.1030, 0.0973, 0.1099)); p4 += dot(p4, p4.wzxy + 33.33); return fract((p4.xxyz + p4.yzzw) * p4.zywx); }
void main(){
  if (vFade <= 0.003) discard;
  float dist = length(vRel);
  vec2 g = (vW - vOff) / uShellCell; vec2 id = floor(g); vec2 f = fract(g);
  vec4 hh = hash42(mod(id, 4096.0));
  float bh = mix(0.45, 1.0, hh.z);
  float rad = mix(0.26, 0.42, hh.w) * saturate(1.0 - uShellS / bh);
  float dd = length(f - (0.2 + hh.xy * 0.6));
  float aa = fwidth(dd) + 1e-3;
  float hit = 1.0 - smoothstep(rad - aa, rad + aa, dd);

  float far = smoothstep(0.6, 2.5, dist * uPixAng / uShellCell);

  o = vec4(toDisplay(c), a);
}`;

precision highp float; precision highp sampler2D;

uniform mat3 uEq; uniform vec3 uR, uU, uF; uniform vec2 uTan;

  clip.z = clip.w;

/* fireflies: drifting, clustered over the meadow, each flashing on its own Photinus-like rhythm */
const FIREFLY_VS = VPRE + SCENE + `
uniform float uFBox, uFlyI, uPxScale;
out vec3 vCol; out float vI;
void main(){
  float id = float(gl_InstanceID), t = uTime;
  vec4 h = hash42(vec2(id * 3.17 + 1.3, 7.7)), h2 = hash42(vec2(id * 1.91 + 9.1, 2.3));
  vec2 wander = vec2(sin(t * (0.21 + 0.17 * h2.x) + h.z * 30.0) + 0.5 * sin(t * (0.53 + 0.3 * h2.y) + h.w * 20.0),
                     cos(t * (0.19 + 0.15 * h2.y) + h.w * 25.0) + 0.5 * cos(t * (0.47 + 0.3 * h2.x) + h.z * 17.0)) * 2.2;
  vec2 wp = (h.xy - 0.5) * uFBox + wander + uWindDirG * t * 0.12 * uWindStr;
  vec2 rel = mod(wp - uCamM.xz + 0.5 * uFBox, uFBox) - 0.5 * uFBox;
  float edge = min(0.5 * uFBox - abs(rel.x), 0.5 * uFBox - abs(rel.y));
  vec2 w = uCamM.xz + rel;
  float hgt = 0.35 + h2.z * h2.z * 2.2 + 0.25 * sin(t * (0.7 + h.x) + h2.w * 40.0);
  vec3 p = vec3(rel.x, terrainH(w, 0.0) - uCamM.y + hgt, rel.y);
  float period = 2.2 + 3.5 * h2.x, ph = fract(t / period + h.z);
  float flash = smoothstep(0.0, 0.06, ph) * (1.0 - smoothstep(0.06, 0.06 + 0.7 / period, ph));
  float breathe = 0.3 + 0.12 * sin(t * (1.3 + h2.y) + h.x * 40.0);
  float patchy = smoothstep(-0.25, 0.35, tn(w * (1.0 / 60.0) + vec2(0.3, 0.8)));
  vI = uFlyI * (breathe + flash) * smoothstep(0.0, 5.0, edge) * patchy * (1.0 - 0.8 * wxFogF(p));
  vCol = mix(vec3(0.62, 1.0, 0.28), vec3(1.0, 0.88, 0.35), h.w);
  gl_Position = project(p);
  float dist = length(p);
  gl_PointSize = vI < 1e-3 ? 0.0 : clamp(uPxScale * 70.0 / max(dist, 0.5), 3.0 * uPxScale, 28.0 * uPxScale);
}`;
const FIREFLY_FS = `#version 300 es
precision highp float;
in vec3 vCol; in float vI; out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0; float r2 = dot(q, q);
  if (r2 > 1.0) discard;
  vec3 c = vCol * vI * (exp(-r2 * 18.0) * 2.0 + exp(-r2 * 3.5) * 0.35);
  o = vec4(1.0 - exp(-c), 1.0);
}`;

      const nT = G / TILE, ts = TILE * cell, mg = ts * 0.4 + 2, tileLoc = Gp.u.uTile;
      for (let tz = 0; tz < nT; tz++) for (let tx = 0; tx < nT; tx++){
        const x0 = ox + tx * ts, z0 = oz + tz * ts, x1 = x0 + ts, z1 = z0 + ts;
        const nx = Math.max(x0, Math.min(0, x1)), nz = Math.max(z0, Math.min(0, z1));
        const dNear = Math.hypot(nx, nz);
        if (dNear > R) continue;
        if (Math.hypot(Math.max(-x0, x1), Math.max(-z0, z1)) < lr[0]) continue;
        const gc = groundH(camM[0] + (x0 + x1) / 2, camM[2] + (z0 + z1) / 2) - camM[1];
        if (!boxVisible(planes, x0, x1, gc - mg, gc + mg + 1.2, z0, z1)) continue;
        gl.uniform2f(tileLoc, tx * TILE, tz * TILE);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 2 * segs + 1, TILE * TILE);
        const dc = Math.hypot((x0 + x1) / 2, (z0 + z1) / 2);
        const keep = (li === 0 ? 1 : clamp((dc - lr[0]) / (lr[1] - lr[0]), 0, 1)) * (1 - clamp((dc - R * 0.78) / (R * 0.22), 0, 1));
        bladeEst += TILE * TILE * keep;
      }
      prevR = R;
    });
  }
  /* terrain */
  {
    const Tt = P.terrain; use(Tt); setScene(Tt);
    tex(Tt, 'uCloud', gl.TEXTURE_2D, hist[cur]); tex(Tt, 'uCloudDepth', gl.TEXTURE_2D, cloudDepth);
    const [NR, NA] = q.terr, Bk = 9, Ak = 60000 / (Math.exp(Bk) - 1);
    set(Tt, 'uNR', NR); set(Tt, 'uNA', NA); set(Tt, 'uRadAB', Ak, Bk);
    set(Tt, 'uNearR', grassOn ? R0 : 0.001); set(Tt, 'uPixAng', 2 * tanY / H); set(Tt, 'uShellR', R0 * 0.5, grassOn ? q.shell[1] : 0.001);
    set(Tt, 'uCloudOver', camK[1] > LAYER[0] - 0.05 ? 1 : 0);
    gl.bindVertexArray(terrainVAO);
    gl.drawElements(gl.TRIANGLES, terrainCount, gl.UNSIGNED_INT, 0);
    gl.bindVertexArray(emptyVAO);
  }
  /* shells: stacked grass slices across the mid-range, drawn top-down over the rings they cover */
  if (grassOn && q.shell[0] > 0){
    const [NS, rOut, cell] = q.shell, [NR, NA] = q.terr, Bk = 9, Ak = 60000 / (Math.exp(Bk) - 1);
    const ringAt = (r) => clamp(Math.floor(Math.log(r / Ak + 1) / Bk * NR), 0, NR);
    const i0 = Math.max(0, ringAt(R0 * 0.25) - 1), i1 = Math.min(NR, ringAt(rOut) + 2);
    const Sh = P.shell; use(Sh); setScene(Sh);
    set(Sh, 'uNR', NR); set(Sh, 'uNA', NA); set(Sh, 'uRadAB', Ak, Bk);
    set(Sh, 'uShellR', R0 * 0.5, rOut); set(Sh, 'uShellCell', cell); set(Sh, 'uPixAng', 2 * tanY / H);
    gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
    gl.bindVertexArray(terrainVAO);
    for (let k = NS - 1; k >= 0; k--){
      set(Sh, 'uShellS', (k + 0.5) / NS * 0.95);
      gl.drawElements(gl.TRIANGLES, (i1 - i0) * NA * 6, gl.UNSIGNED_INT, i0 * NA * 6 * 4);
    }
    gl.bindVertexArray(emptyVAO);
    gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  }
  /* petals: drifting on the wind, plus the stream leading the camera */
  if (S.petals){
    gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
    const Pe = P.petal; use(Pe); setScene(Pe); set(Pe, 'uPBox', 70);
    if (grassOn) gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, q.petals);
    if (streamOn){
      const St = P.stream; use(St); setScene(St);
      gl.uniform4fv(St.u.uTrail, trailUni);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, TRAIL_N);
    }
    gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  }
  /* sky + clouds where nothing was drawn */
  {
    const Sk = P.sky; use(Sk);
    gl.depthFunc(gl.LEQUAL); gl.depthMask(false);
    setCloudCommon(Sk); tex(Sk, 'uSkyLut', gl.TEXTURE_2D, skyTex); tex(Sk, 'uCloud', gl.TEXTURE_2D, hist[cur]);
    set(Sk, 'uCloudSize', CW, CH); set(Sk, 'uSunDisk', L.sunDisk); set(Sk, 'uExposure', expoS); set(Sk, 'uRes', W, H);
    set(Sk, 'uFogW', fogW[0], fogW[1], fogW[2], fogW[3]); set(Sk, 'uFogCol', fogCol); set(Sk, 'uFlashSky', [0.8, 0.85, 1.0].map(v => v * flash * 1.4)); set(Sk, 'uFlashDir', flashTop.map(v => v / ftl));
    set(Sk, 'uSunTrue', L.sunT); set(Sk, 'uMoonDir', L.moonD); set(Sk, 'uMoonDisk', L.moonDisk);
    const off = S.sunAz * Math.PI / 180, dirAE = (az, el) => [Math.cos(el) * Math.sin(az + off), Math.sin(el), Math.cos(el) * Math.cos(az + off)];
    const LATR = LOC.lat * RAD; set(Sk, 'uPole', dirAE(0, LATR)); set(Sk, 'uSouthEq', dirAE(Math.PI, Math.PI / 2 - LATR)); set(Sk, 'uWestEq', dirAE(Math.PI * 1.5, 0));
    set(Sk, 'uSidereal', AST.lst); set(Sk, 'uStarI', L.starI); set(Sk, 'uPixAngS', 2 * tanY / H); set(Sk, 'uTimeS', simTime);
    draw();
    gl.depthMask(true);
  }
  /* real stars, planets and optional constellation lines, added over the sky only (depth test at the far plane) */
  if (L.starCat > 2e-4){
    const off = S.sunAz * RAD, LATR = LOC.lat * RAD, dae = (az, el) => [Math.cos(el) * Math.sin(az + off), Math.sin(el), Math.cos(el) * Math.cos(az + off)];
    const Pv = dae(0, LATR), Sv = dae(Math.PI, Math.PI / 2 - LATR), Wv = dae(Math.PI * 1.5, 0), cl = Math.cos(AST.lst), sl = Math.sin(AST.lst);
    eqMat.set([cl * Sv[0] + sl * Wv[0], cl * Sv[1] + sl * Wv[1], cl * Sv[2] + sl * Wv[2], sl * Sv[0] - cl * Wv[0], sl * Sv[1] - cl * Wv[1], sl * Sv[2] - cl * Wv[2], Pv[0], Pv[1], Pv[2]]);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR); gl.depthFunc(gl.LEQUAL); gl.depthMask(false);
    const St = P.stars; use(St);
    gl.uniformMatrix3fv(St.u.uEq, false, eqMat);
    set(St, 'uR', B.r); set(St, 'uU', B.u); set(St, 'uF', B.f); set(St, 'uTan', tanX, tanY);
    set(St, 'uStarI', L.starCat * (1 - 0.95 * Math.min(1, WXS.fog * 1.5 + WXS.rain + WXS.snow))); set(St, 'uPxScale', W / Math.max(cssW, 1)); set(St, 'uTimeS', simTime);
    tex(St, 'uCloud', gl.TEXTURE_2D, hist[cur]);
    gl.bindVertexArray(starVAO); gl.drawArrays(gl.POINTS, 0, STAR_N);
    updatePlanets(simMs);
    gl.bindVertexArray(planetVAO); gl.drawArrays(gl.POINTS, 0, 5);
    if (S.constel){
      const Ln = P.lines; use(Ln);
      gl.uniformMatrix3fv(Ln.u.uEq, false, eqMat);
      set(Ln, 'uR', B.r); set(Ln, 'uU', B.u); set(Ln, 'uF', B.f); set(Ln, 'uTan', tanX, tanY); set(Ln, 'uLineA', 0.05 + 0.3 * L.night);
      gl.bindVertexArray(lineVAO); gl.drawArrays(gl.LINES, 0, LINE_N);
    }
    gl.bindVertexArray(emptyVAO); gl.disable(gl.BLEND); gl.depthMask(true);
  }
  /* fireflies from dusk on: additive glow, depth-tested against the grass, depth written so DOF treats them as near objects */
  const flyVis = S.flies && grassOn && aglReal < 30 ? smooth(0.2, 0.7, L.night) * (1 - Math.min(1, WXS.rain + WXS.snow)) : 0;
  if (flyVis > 0.01){
    const Fl = P.flies; use(Fl); setScene(Fl);
    set(Fl, 'uFBox', 60); set(Fl, 'uFlyI', 4.2 * flyVis); set(Fl, 'uPxScale', W / Math.max(cssW, 1));
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR); gl.depthFunc(gl.LESS); gl.depthMask(true);
    gl.drawArraysInstanced(gl.POINTS, 0, 1, FLY_COUNT[S.quality] || 240);
    gl.disable(gl.BLEND);
  }
  /* rain streaks (alpha) and lightning channels (additive), depth-tested against the scene */
  if (WXS.rain > 0.01){
    const Rn = P.rain; use(Rn); setScene(Rn);
    set(Rn, 'uRainBox', 30); set(Rn, 'uRainH', 18); set(Rn, 'uRainA', 0.6 * Math.sqrt(WXS.rain));
    set(Rn, 'uRainCol', L.skyIrr.map((v, i) => v / Math.PI * 1.7 + flashAmb[i] / Math.PI * 1.2));
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthFunc(gl.LESS); gl.depthMask(false);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, Math.round((RAIN_N[S.quality] || 3000) * WXS.rain));
    gl.disable(gl.BLEND); gl.depthMask(true);
  }
  if (WXS.snow > 0.01){
    const Sn = P.snow; use(Sn); setScene(Sn);
    set(Sn, 'uSnowBox', 20); set(Sn, 'uSnowH', 14); set(Sn, 'uSnowA', 0.85 * Math.sqrt(WXS.snow));
    set(Sn, 'uSnowCol', L.skyIrr.map((v, i) => v / Math.PI * 3.2 + flashAmb[i] / Math.PI * 1.5));
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthFunc(gl.LESS); gl.depthMask(false);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, Math.round((SNOW_N[S.quality] || 4000) * WXS.snow));
    gl.disable(gl.BLEND); gl.depthMask(true);
  }
  if (flash > 0.02 && bolt.segs.length){
    const n = Math.min(bolt.segs.length, BOLT_MAX), pxs = W / Math.max(cssW, 1);
    for (let i = 0; i < n; i++){
      const [a, b, wd] = bolt.segs[i];
      boltData.set([a[0] - camM[0], a[1] - camM[1], a[2] - camM[2], b[0] - camM[0], b[1] - camM[1], b[2] - camM[2], wd * pxs], i * 7);
    }
    const Bo = P.bolt; use(Bo); setScene(Bo);
    set(Bo, 'uResB', W, H); set(Bo, 'uBoltI', Math.min(3, flash * 2.2 * Math.exp(-fogDens * bolt.dist * 0.3)));
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthFunc(gl.LESS); gl.depthMask(false);
    gl.bindVertexArray(boltVAO); gl.bindBuffer(gl.ARRAY_BUFFER, boltBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, boltData, 0, n * 7);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, n);
    gl.bindVertexArray(emptyVAO); gl.disable(gl.BLEND); gl.depthMask(true);
  }
  gl.disable(gl.DEPTH_TEST);
  /* light shafts */
  const fw = sun[0] * B.f[0] + sun[1] * B.f[1] + sun[2] * B.f[2];
  if (S.god && fw > 0.05){
    const sx = (sun[0] * B.r[0] + sun[1] * B.r[1] + sun[2] * B.r[2]) / (fw * tanX);
    const syy = (sun[0] * B.u[0] + sun[1] * B.u[1] + sun[2] * B.u[2]) / (fw * tanY);
    const off = Math.max(Math.abs(sx), Math.abs(syy));
    const god = Math.max(0, 1 - Math.max(0, off - 1) / 1.2) * Math.min(1, (fw - 0.05) * 4);
    if (god > 0.001){
      const Gd = P.god; use(Gd);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR);
      tex(Gd, 'uCloud', gl.TEXTURE_2D, hist[cur]);
      set(Gd, 'uSunUV', sx * 0.5 + 0.5, syy * 0.5 + 0.5); set(Gd, 'uGod', god); set(Gd, 'uAspect', aspect);
      set(Gd, 'uExposure', expoS); set(Gd, 'uSunCam', L.lightCam); set(Gd, 'uSunDir', sun);
      set(Gd, 'uRight', B.r); set(Gd, 'uUp', B.u); set(Gd, 'uFwd', B.f); set(Gd, 'uTan', tanX, tanY);
      draw();
      gl.disable(gl.BLEND);
    }
  }

  /* ---------------- resolve + post ---------------- */
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, msFBO); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, resFBO);
  gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);

  const dofOn = S.dof > 0.01;
  const setPost = (Pp) => {
    set(Pp, 'uDepthAB', depthAB[0], depthAB[1]); set(Pp, 'uFocus', cam.focus);
    set(Pp, 'uCocK', S.dof * 48 * (HH / 540)); set(Pp, 'uCocMaxN', q.dof[0] * 0.75); set(Pp, 'uCocMaxF', q.dof[0] * 0.35); set(Pp, 'uFocusR', 2.4); set(Pp, 'uSkyCoc', 1 - 0.9 * L.night);
  };
  if (dofOn){
    const Dp = P.dofPrep; use(Dp); gl.bindFramebuffer(gl.FRAMEBUFFER, dofPrepFBO); gl.viewport(0, 0, HW, HH);
    tex(Dp, 'uScene', gl.TEXTURE_2D, sceneTex); tex(Dp, 'uDepth', gl.TEXTURE_2D, depthTex);
    set(Dp, 'uSrcTexel', 1 / W, 1 / H); setPost(Dp);
    draw();
    const Dg = P.dof; use(Dg); gl.bindFramebuffer(gl.FRAMEBUFFER, dofFBO); gl.viewport(0, 0, HW, HH);
    tex(Dg, 'uSrc', gl.TEXTURE_2D, dofPrepTex); set(Dg, 'uTexel', 1 / HW, 1 / HH); set(Dg, 'uMaxR', q.dof[0]); set(Dg, 'uRadStep', q.dof[1]);
    draw();
  }
  {
    const Bp = P.bloomPre; use(Bp); gl.bindFramebuffer(gl.FRAMEBUFFER, bloomDF[0]); gl.viewport(0, 0, bloomSz[0][0], bloomSz[0][1]);
    tex(Bp, 'uSrc', gl.TEXTURE_2D, sceneTex); set(Bp, 'uSrcTexel', 1 / W, 1 / H); set(Bp, 'uThresh', 0.76 - 0.15 * L.glowF);
    draw();
    for (let i = 1; i < bloomD.length; i++){
      const Dn = P.down; use(Dn); gl.bindFramebuffer(gl.FRAMEBUFFER, bloomDF[i]); gl.viewport(0, 0, bloomSz[i][0], bloomSz[i][1]);
      tex(Dn, 'uSrc', gl.TEXTURE_2D, bloomD[i - 1]); set(Dn, 'uSrcTexel', 1 / bloomSz[i - 1][0], 1 / bloomSz[i - 1][1]);
      draw();
    }
  }
  let bloomOut = bloomD[bloomD.length - 1];
  for (let i = bloomD.length - 2; i >= 0; i--){
    const Up = P.up; use(Up); gl.bindFramebuffer(gl.FRAMEBUFFER, bloomUF[i]); gl.viewport(0, 0, bloomSz[i][0], bloomSz[i][1]);
    tex(Up, 'uSrc', gl.TEXTURE_2D, bloomOut); tex(Up, 'uBase', gl.TEXTURE_2D, bloomD[i]);
    set(Up, 'uSrcTexel', 1 / bloomSz[i + 1][0], 1 / bloomSz[i + 1][1]);
    draw();
    bloomOut = bloomU[i];
  }
  {
    /* lens rain: simulate and draw the water map, then return to the screen */
    const lensOn = S.lensDrops && (WXS.rain > 0.01 || LR.drops.length > 0);
    if (lensOn){
      const yr = (cam.yaw - LR.lastYaw) / Math.max(dt, 1e-3);
      lensRainUpdate(dt, WXS.rain, W / H, clamp(yr, -3, 3));
      lensRainDraw(W / H);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    } else if (!S.lensDrops) LR.drops.length = 0;
    LR.lastYaw = cam.yaw;
    const Fi = P.final; use(Fi); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    tex(Fi, 'uScene', gl.TEXTURE_2D, sceneTex); tex(Fi, 'uDepth', gl.TEXTURE_2D, depthTex);
    tex(Fi, 'uDof', gl.TEXTURE_2D, dofTex); tex(Fi, 'uBloom', gl.TEXTURE_2D, bloomOut);
    set(Fi, 'uSat', L.grade.sat); set(Fi, 'uShTint', L.grade.sh); set(Fi, 'uHiTint', L.grade.hi); set(Fi, 'uLift', L.grade.lift);
    set(Fi, 'uDrops', lensOn && LR.tex ? 1 : 0); set(Fi, 'uTimeD', simTime); if (LR.tex) tex(Fi, 'uLens', gl.TEXTURE_2D, LR.tex);
    set(Fi, 'uDofOn', dofOn ? 1 : 0); set(Fi, 'uBloomI', 0.16 + 0.2 * L.glowF); set(Fi, 'uNight', L.night); set(Fi, 'uFrameN', frameNo % 997); set(Fi, 'uRes', W, H); setPost(Fi);
    draw();
  }

  histIdx = 1 - histIdx; frameNo++;

  /* stats + adaptive quality */
  statAcc += dt; statFrames++; statT += dt;
  if (statT > 0.5){
    const fps = statFrames / statAcc;
    $('fps').textContent = fps.toFixed(1); $('ms').textContent = '帧时间 ' + (1000 / fps).toFixed(1) + ' ms';
    wxStatus();
    $('clock').textContent = LOC.name + ' ' + fmtTime(S.time) + '，' + phaseName(AST.phase);
    $('locSun').textContent = riseSetText(simMs);
    if (performance.now() - lastTimeInput > 600){ timeCtl.el.value = S.time; timeCtl.paint(); }
    $('blades').textContent = grassOn ? '可见草叶约 ' + (bladeEst / 10000).toFixed(1) + ' 万' : '草叶未绘制（高空）';
    statAcc = 0; statFrames = 0; statT = 0;
  }
  if (!userPickedQuality && downgrades < 2 && frameNo > 30){
    perfFrames++; perfAcc += dt;
    if (perfFrames >= 90){
      const avg = perfAcc / perfFrames; perfFrames = 0; perfAcc = 0;
      const order = ['low', 'med', 'high', 'ultra'], idx = order.indexOf(S.quality);
      if (avg > 0.042 && idx > 0){ downgrades++; setQuality(order[idx - 1]); }
    }
  }
  requestAnimationFrame(frame);
}

resize(true);
requestAnimationFrame(frame);
})();
